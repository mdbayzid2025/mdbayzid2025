# How to Use

1. Create a repository named `assets` or `images`.
2. Create a file named `cover.svg`.
3. Paste the SVG code into that file.
4. Commit and push to GitHub.
5. Use this raw URL format:

```txt
https://raw.githubusercontent.com/YOUR_USERNAME/REPO_NAME/main/cover.svg
```

Example:

```txt
https://raw.githubusercontent.com/yourname/assets/main/cover.svg
```

Then use it inside your GitHub README like this:

```md
<img src="https://raw.githubusercontent.com/yourname/assets/main/cover.svg" width="100%" />
```
